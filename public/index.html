<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkBuddy Feed</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1f2329; --muted: #8a919f;
    --accent: #1a73e8; --border: #e5e8ec; --tag-bg: #e8f0fe; --tag-text: #1a5cc8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 680px; margin: 0 auto; padding: 16px 14px 80px; }

  /* login */
  #login { max-width: 360px; margin: 18vh auto 0; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 32px 28px; text-align: center; }
  #login h1 { font-size: 20px; margin-bottom: 6px; }
  #login p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  #login input { width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; margin-bottom: 12px; }
  #login button { width: 100%; padding: 11px; background: var(--accent); color: #fff; border: 0; border-radius: 10px; font-size: 15px; cursor: pointer; }
  #login .err { color: #d33; font-size: 13px; margin-bottom: 10px; min-height: 16px; }

  /* header */
  header { display: flex; justify-content: space-between; align-items: center; padding: 6px 2px 14px; gap: 8px; }
  header .logo { font-size: 19px; font-weight: 700; white-space: nowrap; cursor: pointer; user-select: none; border-radius: 8px; padding: 2px 6px 2px 2px; }
  header .logo:hover { background: #eef1f4; }
  header .logo span { color: var(--accent); }
  header > div:last-child { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  header button { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 5px 10px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  header .who { color: var(--text); font-size: 13px; white-space: nowrap; max-width: 88px; overflow: hidden; text-overflow: ellipsis; }
  /* 刷新按钮 */
  header button.iconbtn { padding: 5px 8px; font-size: 14px; line-height: 1.2; }
  header button.iconbtn.spin { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* composer */
  .composer { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .composer textarea { width: 100%; min-height: 90px; border: 0; resize: vertical; font-size: 15px; line-height: 1.6; font-family: inherit; outline: none; }
  .composer .bar { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .composer .hint { color: var(--muted); font-size: 12px; }
  .composer .btns { display: flex; gap: 8px; }
  .composer .btns button { border: 0; border-radius: 9px; padding: 8px 18px; font-size: 14px; cursor: pointer; }
  #postBtn { background: var(--accent); color: #fff; }
  .composer .tools { display: flex; gap: 8px; align-items: center; margin-top: 10px; position: relative; }
  .composer .tools > button { border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 4px 10px; font-size: 16px; cursor: pointer; line-height: 1.3; }
  .composer .tools > button:hover { background: var(--tag-bg); }
  .composer .tools .tagbtn { font-size: 13px; color: var(--tag-text); }
  .composer .tools select { border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 4px 8px; font-size: 13px; color: var(--text); }
  .pop { display: none; position: absolute; bottom: 40px; left: 0; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); z-index: 50; max-width: min(312px, calc(100vw - 56px)); }
  .pop.show { display: block; }
  .pop .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .pop .grid button { border: 0; background: none; font-size: 21px; cursor: pointer; border-radius: 6px; padding: 3px 1px; line-height: 1.3; }
  .pop .grid button:hover { background: var(--tag-bg); }
  .pop .taglist { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .pop .chip { background: var(--tag-bg); color: var(--tag-text); border-radius: 6px; padding: 3px 9px; font-size: 13px; cursor: pointer; user-select: none; }
  .pop .chip:hover { filter: brightness(.95); }
  .pop .none { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .pop .newrow { display: flex; gap: 6px; padding-top: 8px; border-top: 1px solid var(--border); }
  .pop .newrow input { flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; font-size: 13px; }
  .pop .newrow button { border: 0; background: var(--accent); color: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }

  /* 成员管理面板 */
  #usersPanel { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 100; align-items: flex-start; justify-content: center; padding: 8vh 14px; }
  #usersPanel.show { display: flex; }
  #usersPanel .card { background: var(--card); border-radius: 14px; padding: 18px; width: 100%; max-width: 540px; max-height: 80vh; overflow: auto; }
  #usersPanel h3 { margin-bottom: 4px; }
  #usersPanel .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; line-height: 1.6; }
  .userrow { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; flex-wrap: wrap; }
  .userrow .name { font-weight: 600; min-width: 72px; }
  .userrow .role { font-size: 11px; color: var(--muted); border: 1px solid var(--border); padding: 1px 6px; border-radius: 6px; }
  .userrow .link { flex: 1; min-width: 200px; color: var(--accent); font-size: 12px; word-break: break-all; }
  .userrow button, .addrow button { border: 1px solid var(--border); background: none; border-radius: 7px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
  .userrow button:hover { color: var(--accent); border-color: var(--accent); }
  .addrow { display: flex; gap: 8px; margin-top: 14px; }
  .addrow input { flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  .addrow .primary { background: var(--accent); color: #fff; border: 0; font-size: 13px; padding: 8px 16px; }
  #usersPanel .err { color: #d33; font-size: 12px; min-height: 15px; margin-top: 6px; }

  /* toolbar */
  .toolbar { display: flex; gap: 8px; margin: 6px 0 14px; flex-wrap: wrap; align-items: center; }
  .toolbar input[type=search] { flex: 1; min-width: 160px; padding: 9px 13px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; background: var(--card); }
  .toolbar select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); font-size: 13px; color: var(--text); }

  /* memo list */
  .memo { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .memo.pinned { border-color: #f5c518; box-shadow: 0 0 0 1px #f5c51833; }
  .memo .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; font-size: 12px; color: var(--muted); }
  .memo .meta .who { color: var(--tag-text); background: var(--tag-bg); border-radius: 6px; padding: 1px 8px; font-weight: 600; }
  .memo .meta .pin-flag { color: #b8860b; font-weight: 600; }
  .memo .content { font-size: 15px; line-height: 1.7; word-break: break-word; }
  .memo .content code { background: #eef1f4; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .memo .content .tag { color: var(--tag-text); background: var(--tag-bg); padding: 0 5px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .memo .content a { color: var(--accent); }
  .memo .actions { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .memo .actions span { cursor: pointer; user-select: none; }
  .memo .actions span:hover { color: var(--accent); }
  .memo textarea.editbox { width: 100%; min-height: 80px; border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 14px; line-height: 1.6; font-family: inherit; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; font-size: 14px; }
  .count { color: var(--muted); font-size: 12px; margin: 4px 2px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .count .fresh { font-size: 11px; white-space: nowrap; }

  /* 筛选栏里的星标收藏开关 */
  .toolbar .chipbtn { border: 1px solid var(--border); background: var(--card); color: var(--muted); border-radius: 10px; padding: 8px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .toolbar .chipbtn.on { background: #fff8e1; border-color: #f5c518; color: #a9761a; font-weight: 600; }

  /* 折叠卡片：标题 + 标签 + 正文最多 2 行 */
  .memo { cursor: pointer; }
  .memo .title { font-size: 15px; font-weight: 600; line-height: 1.55; margin-bottom: 6px; word-break: break-word; }
  .memo .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 7px; }
  .memo .tags:empty { display: none; }
  .memo .tags .tchip { background: var(--tag-bg); color: var(--tag-text); border-radius: 6px; padding: 1px 8px; font-size: 12px; cursor: pointer; user-select: none; }
  .memo .tags .tchip.fav { background: #fff6d8; color: #a9761a; }
  .memo:not(.open) .title,
  .memo:not(.open) .content { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
  .memo:not(.open) .title { -webkit-line-clamp: 1; }
  .memo:not(.open) .content { -webkit-line-clamp: 2; }
  .memo .star { cursor: pointer; font-size: 18px; line-height: 1; color: #c9ccd3; user-select: none; }
  .memo .star.on { color: #f5b301; }
  .memo .meta .starbox { display: flex; align-items: center; gap: 8px; }
  .memo .expand-hint { color: var(--accent); }

  /* 分页器（放在筛选栏下面） */
  .pager { display: flex; justify-content: center; align-items: center; gap: 6px; margin: 0 0 8px; flex-wrap: wrap; }
  .pager:empty { display: none; }
  .pager button { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 9px; padding: 7px 12px; font-size: 13px; cursor: pointer; min-width: 38px; }
  .pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .pager button:disabled { opacity: .4; cursor: default; }
  .pager button.cur { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .pager .pinfo { color: var(--muted); font-size: 13px; padding: 0 2px; }

  /* TODO 状态（徽章配色只作用于 .stchip，卡片只留淡底色） */
  .stchip { font-size: 11px; font-weight: 600; border-radius: 6px; padding: 1px 8px; white-space: nowrap; }
  .stchip.st-new     { background: #eef1f4; color: #5a6472; }
  .stchip.st-doing   { background: #e8f0fe; color: #1a5cc8; }
  .stchip.st-done    { background: #e6f7e9; color: #1a7f37; }
  .stchip.st-dropped { background: #f0f0f0; color: #9aa0a6; text-decoration: line-through; }
  .stchip.st-expired { background: #fdecea; color: #c5221f; }
  .memo.st-doing   { background: #f8faff; }
  .memo.st-done    { background: #f8fcf9; }
  .memo.st-done .title, .memo.st-dropped .title { text-decoration: line-through; opacity: .75; }
  .memo.st-dropped { opacity: .72; }
  .memo.st-expired { border-left: 3px solid #e8a0a0; background: #fffbfa; }
  .memo .actions select { border: 1px solid var(--border); background: var(--card); border-radius: 7px; padding: 2px 6px; font-size: 12px; color: var(--text); cursor: pointer; }

  /* 消息视图：收件人输入 + 卡片头 */
  .composer .tools input.rcpt { border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 4px 8px; font-size: 13px; width: 132px; color: var(--text); }
  .who-arrow { color: var(--muted); }
  .msgcard .content { font-size: 15px; }
  .tochip { background: #f1f3f6; color: #444c56; border-radius: 6px; padding: 1px 7px; font-size: 11px; font-weight: 600; }
  .tochip.all { background: #e8f0fe; color: #1a5cc8; }

  /* 接入说明视图（给 agent 看的说明书） */
  .intro-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; }
  .intro-card h3 { font-size: 15px; margin-bottom: 9px; }
  .intro-card p { color: var(--muted); font-size: 13px; line-height: 1.75; margin-bottom: 9px; }
  .intro-card p:last-child { margin-bottom: 0; }
  .intro-card ol, .intro-card ul { margin: 0 0 10px 18px; color: var(--muted); font-size: 13px; line-height: 1.85; }
  .intro-card li { margin-bottom: 2px; }
  .intro-card b { color: var(--text); }
  .intro-hero { border-color: #c9dcff; background: linear-gradient(180deg, #f3f8ff, #fff); }
  pre.code { position: relative; background: #1f2329; color: #e6e8eb; border-radius: 10px; padding: 12px 14px; font-size: 12.5px; line-height: 1.72; overflow-x: auto; white-space: pre; font-family: ui-monospace, Menlo, Consolas, monospace; margin: 0 0 10px; }
  pre.code .cp { position: absolute; top: 7px; right: 7px; background: rgba(255,255,255,.16); color: #e6e8eb; border: 0; border-radius: 6px; padding: 2px 9px; font-size: 11px; cursor: pointer; font-family: inherit; }
  pre.code .cp:hover { background: rgba(255,255,255,.28); }
  .cmds { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .cmds td { padding: 6px 4px; border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.6; }
  .cmds tr:last-child td { border-bottom: 0; }
  .cmds td:first-child { width: 47%; color: var(--tag-text); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; }
  .cmds td:last-child { color: var(--muted); }
  .scrollx { overflow-x: auto; }
  .tok { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; background: #eef1f4; border-radius: 6px; padding: 1px 6px; }
  .intro-card .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .intro-card .row button { border: 1px solid var(--border); background: var(--card); color: var(--muted); border-radius: 8px; padding: 5px 11px; font-size: 12px; cursor: pointer; }
  .intro-card .row button:hover { color: var(--accent); border-color: var(--accent); }
  .intro-card .row button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.cp-inline { border: 1px solid var(--border); background: var(--card); color: var(--muted); border-radius: 7px; padding: 2px 9px; font-size: 12px; cursor: pointer; margin-left: 4px; font-family: inherit; }
  button.cp-inline:hover { color: var(--accent); border-color: var(--accent); }
  .intro-note { font-size: 12px; color: var(--muted); line-height: 1.7; }
  .warnbox { background: #fff8e1; border: 1px solid #f0dda0; border-radius: 10px; padding: 10px 12px; font-size: 12.5px; color: #7a5b00; line-height: 1.75; }

  /* mobile */
  @media (max-width: 480px) {
    .wrap { padding: 12px 10px 70px; }
    .memo .content { font-size: 15px; }
    header { gap: 4px; }
    header .logo { font-size: 16px; }
    header .brand-long { display: none; } /* 小屏收成「📒 Feed」，给刷新/成员按钮腾位置 */
    header button { font-size: 12px; padding: 4px 7px; }
    header button.iconbtn { padding: 4px 6px; }
    header .who { font-size: 12px; max-width: 64px; }
    #exportBtn { display: none; } /* 小屏空间有限，导出在电脑端使用 */
  }
</style>
</head>
<body>

<div id="login">
  <h1>📒 WorkBuddy Feed</h1>
  <p>团队信息流 · ToDo · 消息队列（成员请用专属链接进入）</p>
  <div class="err" id="loginErr"></div>
  <input type="password" id="pwd" placeholder="访问密码" onkeydown="if(event.key==='Enter')doLogin()">
  <button onclick="doLogin()">进入</button>
</div>

<div id="app" style="display:none">
  <div class="wrap">
    <header>
      <div class="logo" id="logoBtn" onclick="toggleView()" title="点击切换 Feed / ToDo / 消息">📒 <span class="brand-long">WorkBuddy </span><span id="logoName">Feed</span></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="who" id="who"></span>
        <button id="refreshBtn" class="iconbtn" onclick="manualRefresh()" title="刷新（每 60 秒自动刷新）">🔄</button>
        <button id="usersBtn" style="display:none" onclick="openUsers()">👥 成员</button>
        <button id="exportBtn" onclick="window.open('/api/memos/export')">⬇️ 导出</button>
        <button onclick="doLogout()">退出</button>
      </div>
    </header>

    <div class="composer">
      <textarea id="input" placeholder="记录此刻的想法… 支持 #标签 `代码` **加粗** 和链接" onkeydown="if((event.metaKey||event.ctrlKey)&&event.key==='Enter')post()"></textarea>
      <div class="tools">
        <select id="newStatus" style="display:none" title="初始状态">
          <option value="new">新建</option>
          <option value="doing">进行中</option>
          <option value="done">已完成</option>
          <option value="dropped">废弃</option>
          <option value="expired">过期</option>
        </select>
        <input id="newRecipient" class="rcpt" style="display:none" maxlength="24" placeholder="收件人（默认 all）" title="留空 = 广播给 all">
        <button type="button" onclick="togglePop('emojiPop', event)" title="插入表情">😀</button>
        <button type="button" class="tagbtn" onclick="togglePop('tagPop', event)" title="选择或新建标签"># 标签</button>
        <div class="pop" id="emojiPop">
          <div class="grid" id="emojiGrid"></div>
        </div>
        <div class="pop" id="tagPop">
          <div class="taglist" id="tagChips"></div>
          <div class="newrow">
            <input id="newTag" placeholder="新建标签，如 工作" onkeydown="if(event.key==='Enter')newTag()">
            <button type="button" onclick="newTag()">插入</button>
          </div>
        </div>
      </div>
      <div class="bar">
        <span class="hint" id="composerHint">表情 · #标签 均可搜索 · Ctrl+Enter 发送</span>
        <div class="btns"><button id="postBtn" onclick="post()">记录</button></div>
      </div>
    </div>

    <div class="toolbar">
      <input type="search" id="q" placeholder="搜索内容或标签…" oninput="onFilterChange()">
      <select id="statusFilter" style="display:none" onchange="onFilterChange()">
        <option value="">全部状态</option>
        <option value="new">新建</option>
        <option value="doing">进行中</option>
        <option value="done">已完成</option>
        <option value="dropped">废弃</option>
        <option value="expired">过期</option>
      </select>
      <select id="tagFilter" onchange="onFilterChange()"><option value="">全部标签</option></select>
      <select id="recipientFilter" style="display:none" onchange="onFilterChange()"><option value="">全部收件人</option></select>
      <select id="sortSel" onchange="onFilterChange()">
        <option value="new">最新优先</option>
        <option value="old">最早优先</option>
      </select>
      <button type="button" id="favBtn" class="chipbtn" onclick="toggleFavFilter()" title="只看打了星的收藏">⭐ 收藏</button>
    </div>

    <div class="pager" id="pager"></div>
    <div class="count"><span id="countText"></span><span class="fresh" id="freshInfo"></span></div>
    <div id="list"></div>
    <div id="intro" style="display:none"></div>
  </div>
</div>

<div id="usersPanel">
  <div class="card">
    <h3>👥 成员管理</h3>
    <div class="sub">每个成员一条专属链接，点开即免密进入，发布的消息会带上成员名字。把「专属链接」发给对应成员即可（手机上可添加到主屏幕）。</div>
    <div id="userList"></div>
    <div class="addrow">
      <input id="newUserName" placeholder="成员名字，如 小明" maxlength="24" onkeydown="if(event.key==='Enter')addUser()">
      <button class="primary" onclick="addUser()">＋ 添加成员</button>
    </div>
    <div class="err" id="usersErr"></div>
    <div class="addrow"><button onclick="closeUsers()">关闭</button></div>
  </div>
</div>

<script>
let memos = [];
let todos = [];
let msgs = [];
let view = 'feed'; // 'feed' | 'todo' | 'msg'（点左上角 Logo 循环切换）
let editingId = null;
let me = { name: '', role: '' };

const PAGE_SIZE = 20;
const FAV_TAG = '收藏';
// TODO 状态：key -> 中文名
const ST = { new: '新建', doing: '进行中', done: '已完成', dropped: '废弃', expired: '过期' };
let page = 1;
let favOnly = false;
const openIds = new Set();

const apiBase = () => (view === 'todo' ? '/api/todos' : view === 'msg' ? '/api/messages' : '/api/memos');
const items = () => (view === 'todo' ? todos : view === 'msg' ? msgs : memos);
const noun = () => (view === 'todo' ? 'ToDo' : view === 'msg' ? '消息' : 'memo');

async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  const r = await fetch(path, opts);
  if (r.status === 401) { showLogin(); throw new Error('unauth'); }
  return r.json();
}

async function doLogin() {

// 代码块可一键复制，人只要转交命令，不用自己讲一遍怎么用。
const COPY = [];

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function copyText(text, el) {
  const done = () => {
    if (!el) return;
    const old = el.textContent;
    el.textContent = '✓ 已复制';
    setTimeout(() => { el.textContent = old; }, 1400);
  };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { /* 忽略 */ }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

function copyAt(i, el) { copyText(COPY[i], el); }

function cpBtn(text, cls, label) {
  COPY.push(text);
  return `<button class="${cls || 'cp'}" onclick="copyAt(${COPY.length - 1}, this)">${label || '复制'}</button>`;
}

function codeBlock(text) {
  return `<pre class="code">${cpBtn(text)}${esc(text)}</pre>`;
}

function maskToken(t) {
  return t ? t.slice(0, 6) + '……' + t.slice(-4) : '（当前登录没有 token）';

// ---- 刷新：手动（🔄）+ 每 60 秒自动 ----
const REFRESH_INTERVAL = 60000;
let lastRefresh = 0;
let autoTimer = null;
let refreshing = false;

// 用来判断数据有没有变（避免无变化时重绘、打断滚动/选中）
function snapshot() {
  return items().map(m => `${m.id}:${m.updatedTs || m.createdTs}:${m.status || ''}:${m.pinned ? 1 : 0}`).join('|');
}

// 把接口返回塞进对应数组（三种视图字段名不同）
function assignData(d) {
  if (view === 'todo') todos = d.todos || [];
  else if (view === 'msg') msgs = d.messages || [];
  else memos = d.memos || [];
}

async function loadItems() {
  if (view === 'intro') return; // 接入说明不拉列表
  const d = await api(apiBase());
  assignData(d);
  lastRefresh = Date.now();
  render();
}

function updateFresh(msg) {
  const el = document.getElementById('freshInfo');
  if (!el) return;
  if (msg) {
    el.textContent = msg;
    clearTimeout(updateFresh._t);
    updateFresh._t = setTimeout(() => updateFresh(), 2500);
    return;
  }
  if (!lastRefresh) { el.textContent = ''; return; }
  const d = new Date(lastRefresh);
  const pad = n => String(n).padStart(2, '0');
  el.textContent = `自动刷新 ${REFRESH_INTERVAL / 1000}s · ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

async function refreshItems(manual) {
  if (refreshing) return;
  if (view === 'intro') return; // 静态页，不需要轮询
  // 未登录 / 编辑中（自动刷新时不打断）/ 页面在后台（自动刷新时跳过）
  if (document.getElementById('app').style.display === 'none') return;
  if (!manual && editingId !== null) return;
  if (!manual && document.visibilityState === 'hidden') return;

  refreshing = true;
  const btn = document.getElementById('refreshBtn');
  if (btn) btn.classList.add('spin');
  const before = snapshot();
  let err = '';
  try {
    const d = await api(apiBase());
    assignData(d);
    lastRefresh = Date.now();
    if (snapshot() !== before) { render(); } else { updateFresh(); }
  } catch (e) {
    err = '刷新失败，稍后重试';
    updateFresh(err);
  } finally {
    refreshing = false;
    if (btn) setTimeout(() => btn.classList.remove('spin'), 400);
    if (manual && !err) updateFresh(snapshot() === before ? '已是最新' : '');
  }
}

function manualRefresh() { refreshItems(true); }

function startAutoRefresh() {
  if (autoTimer) clearInterval(autoTimer);
  autoTimer = setInterval(() => refreshItems(false), REFRESH_INTERVAL);
  // 从后台切回前台时立刻补一次（不等到下一个 60s）
  if (!startAutoRefresh._bound) {
    startAutoRefresh._bound = true;
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') refreshItems(false);
    });
    window.addEventListener('focus', () => {
      if (Date.now() - lastRefresh > REFRESH_INTERVAL) refreshItems(false);
    });
  }
  updateFresh();
}

function personalLink(token) {
  const sc = new URLSearchParams(location.search).get('sharecode');

}

async function loadUsers() {
  const d = await api('/api/users');
  const box = document.getElementById('userList');
  box.innerHTML = d.users.map(u => `
    <div class="userrow">
      <span class="name">${u.name.replace(/</g,'&lt;')}</span>
      <span class="role">${u.role === 'admin' ? '管理员' : '成员'}</span>

function copyLink(token) {
  const link = personalLink(token);
  (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject())
    .catch(() => { const i = document.createElement('textarea'); i.value = link; document.body.appendChild(i); i.select(); document.execCommand('copy'); i.remove(); });

async function addUser() {
  const inp = document.getElementById('newUserName');
  const name = inp.value.trim();
  if (!name) return;
  const r = await fetch('/api/users', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { document.getElementById('usersErr').textContent = d.error === 'name_exists' ? '这个名字已存在' : '添加失败'; return; }
  inp.value = '';
  document.getElementById('usersErr').textContent = `已添加「${d.user.name}」，点击其链接可复制`;

async function delUser(id, name) {
  if (!confirm(`确定删除成员「${name}」？其专属链接将立即失效。`)) return;
  const r = await fetch('/api/users/' + id, { method: 'DELETE' });
  if (!r.ok) { document.getElementById('usersErr').textContent = '删除失败'; return; }
  await loadUsers();

async function post() {

  if (!el.value.trim()) return;
  const body = { content: el.value };

  if (view === 'msg') body.to = document.getElementById('newRecipient').value.trim() || 'all';
  await api(apiBase(), { method: 'POST', body: JSON.stringify(body) });
  el.value = '';
  if (view === 'msg') document.getElementById('newRecipient').value = '';
  page = 1;
  await loadItems();
}

function esc(s) {
  let h = s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
       .replace(/`([^`]+)`/g, '<code>$1</code>')
       .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
       .replace(/(^|\s)(#[^\s<]+)/g, '$1<span class="tag" onclick="filterTag(\'$2\')">$2</span>');
  return h.replace(/\n/g, '<br>');
}

function esc0(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmt(ts) {
  const d = new Date(ts);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function filterTag(t) {
  document.getElementById('q').value = t;
  page = 1;
  render();
}

// ---- 表情 & 标签面板 ----
const EMOJIS = ['😀','😄','😂','🤣','😊','😍','🥰','😘','😎','🤔','😐','😴','😭','😡','🥳','🤯',
  '👍','👎','👏','🙏','🤝','💪','✌️','🫡','❤️','💔','💯','🔥','⭐','✨','🎉','🎊',
  '💡','📌','📝','✅','❌','⚠️','❓','❗','💤','☕','🍵','🍜','🍎','🍰','🍺','🥤',
  '🚀','🏠','🚗','✈️','🌧️','☀️','🌙','⚡','🐱','🐶','🌸','🎵','⚽','💰','💼','📚'];

let activeBox = null;
document.addEventListener('focusin', e => { if (e.target.matches('textarea')) activeBox = e.target; });

function insertText(txt) {
  const el = activeBox || document.getElementById('input');
  const s = el.selectionStart ?? el.value.length;
  const e = el.selectionEnd ?? s;
  const needSpace = s > 0 && !/\s$/.test(el.value.slice(0, s));
  const text = (needSpace ? ' ' : '') + txt;
  el.value = el.value.slice(0, s) + text + el.value.slice(e);
  const pos = s + text.length;
  el.focus();
  el.setSelectionRange(pos, pos);
}

function togglePop(id, ev) {
  if (ev) ev.stopPropagation();
  const pop = document.getElementById(id);
  document.querySelectorAll('.pop').forEach(p => { if (p !== pop) p.classList.remove('show'); });
  if (id === 'tagPop') renderTagPop();
  pop.classList.toggle('show');
}

function closePops() { document.querySelectorAll('.pop').forEach(p => p.classList.remove('show')); }
document.addEventListener('click', e => {
  if (!e.target.closest('.pop') && !e.target.closest('.tools > button')) closePops();
});

function renderTagPop() {
  const tags = [...new Set(items().flatMap(m => m.tags))].sort();
  const box = document.getElementById('tagChips');
  box.innerHTML = tags.length
    ? tags.map(t => `<span class="chip" onclick="insertText('#${t}');closePops()">#${t}</span>`).join('')
    : '<div class="none">还没有标签，在下面新建一个吧</div>';
}

function newTag() {
  const inp = document.getElementById('newTag');
  const t = inp.value.trim().replace(/^#+/, '').replace(/\s+/g, '');
  if (!t) return;
  insertText('#' + t);
  inp.value = '';
  closePops();
}

(function initEmojiGrid() {
  document.getElementById('emojiGrid').innerHTML =
    EMOJIS.map(e => `<button type="button" onclick="insertText('${e}');closePops()">${e}</button>`).join('');
})();

function startEdit(id) {
  editingId = id;
  render();
}

async function saveEdit(id) {
  const ta = document.querySelector('.editbox');
  await api(apiBase() + '/' + id, { method: 'PATCH', body: JSON.stringify({ content: ta.value }) });
  editingId = null;
  await loadItems();
}

async function togglePin(id) {
  const m = memos.find(x => x.id === id);
  await api('/api/memos/' + id, { method: 'PATCH', body: JSON.stringify({ pinned: !m.pinned }) });
  await loadItems();
}

async function setTodoStatus(id, status) {
  try {
    const d = await api('/api/todos/' + id, { method: 'PATCH', body: JSON.stringify({ status }) });
    if (d && d.todo) {
      const i = todos.findIndex(x => x.id === id);
      if (i >= 0) todos[i] = d.todo;
    }
  } catch (e) { return; }
  render();
}

async function del(id) {
  if (!confirm(`确定删除这条 ${noun()}？`)) return;
  await api(apiBase() + '/' + id, { method: 'DELETE' });
  await loadItems();
}

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase().replace(/^#/, '');
  const sort = document.getElementById('sortSel').value;
  const src = items();
  let list = src.slice();
  if (q) list = list.filter(m => String(m.content).toLowerCase().includes(q) || (m.tags || []).some(t => t.toLowerCase().includes(q)));

  // tag filter options（消息视图没有标签）
  const tags = view === 'msg' ? [] : [...new Set(src.flatMap(m => m.tags || []))].sort();
  const sel = document.getElementById('tagFilter');
  const cur = sel.value;
  sel.innerHTML = '<option value="">全部标签</option>' + tags.map(t => `<option ${t===cur?'selected':''}>${t}</option>`).join('');
  const tf = sel.value;
  if (tf) list = list.filter(m => (m.tags || []).includes(tf));

  // 收件人筛选（仅消息视图）
  if (view === 'msg') {
    const rsel = document.getElementById('recipientFilter');
    const rcur = rsel.value;
    const rcpts = [...new Set(src.map(m => m.recipient || 'all'))].sort();
    rsel.innerHTML = '<option value="">全部收件人</option>' +
      rcpts.map(r => `<option ${r===rcur?'selected':''}>${r}</option>`).join('');
    if (rsel.value) list = list.filter(m => (m.recipient || 'all') === rsel.value);
  }

  let sf = '';
  if (view === 'todo') {
    sf = document.getElementById('statusFilter').value;
    if (sf) list = list.filter(m => (m.status || 'new') === sf);
  }
  if (favOnly) list = list.filter(isFav);

  list.sort((a, b) => ((b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)) ||
    (sort === 'new' ? b.createdTs - a.createdTs : a.createdTs - b.createdTs));

  // ---- 分页 ----
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (page > pages) page = pages;
  if (page < 1) page = 1;
  const start = (page - 1) * PAGE_SIZE;
  const pageList = list.slice(start, start + PAGE_SIZE);

  const total = src.length;
  const favCount = src.filter(isFav).length;
  let ct = total ? `共 ${total} 条 ${noun()}` : '';
  if (q || tf || favOnly || sf || (view === 'msg' && document.getElementById('recipientFilter').value)) ct += ` · 筛选出 ${list.length} 条`;
  if (pages > 1) ct += ` · 第 ${page}/${pages} 页`;
  if (favCount) ct += ` · ⭐ ${favCount}`;
  document.getElementById('countText').textContent = ct;
  updateFresh();

  const box = document.getElementById('list');
  if (!list.length) {
    let msg;
    if (favOnly) msg = `还没有收藏，点 ${noun()} 右侧的 ☆ 就能收藏 ⭐`;
    else if (q || tf || sf) msg = '没有匹配的记录';
    else msg = view === 'todo' ? '还没有 ToDo，添加一条吧 ✅'
      : view === 'msg' ? '还没有消息，发第一条吧 💬'
      : '还没有记录，写下第一条吧 ✍️';
    box.innerHTML = `<div class="empty">${msg}</div>`;
    document.getElementById('pager').innerHTML = '';
    return;
  }
  box.innerHTML = pageList.map(m => view === 'todo' ? todoCardHtml(m) : view === 'msg' ? msgCardHtml(m) : memoCardHtml(m)).join('');

  renderPager(list.length, pages);
  requestAnimationFrame(syncExpandHints);
}

function starboxHtml(m) {
  const fav = isFav(m);
  const edited = m.updatedTs > m.createdTs ? '<span style="font-size:11px;color:var(--muted)">已编辑</span>' : '';
  return `<span class="starbox">${edited}<span class="star ${fav?'on':''}" title="${fav?'取消收藏':'收藏'}" onclick="toggleStar(event,'${m.id}')">${fav?'★':'☆'}</span></span>`;
}

function tagChipsHtml(m) {
  const chips = (m.tags || []).map(t =>
    `<span class="tchip ${t === FAV_TAG ? 'fav' : ''}" onclick="event.stopPropagation();filterTag('#${String(t).replace(/'/g,'')}')">${t === FAV_TAG ? '⭐ 收藏' : '#' + String(t).replace(/</g,'&lt;')}</span>`).join('');
  return chips ? `<div class="tags">${chips}</div>` : '';
}

// memo 卡片（Feed 视图）
function memoCardHtml(m) {
  if (m.id === editingId) return editCardHtml(m);
  const open = openIds.has(m.id);
  const parts = splitMemo(m.content);
  const titleTxt = plainTitle(parts.title) || parts.title || '（无标题）';
  return `<div class="memo ${m.pinned?'pinned':''} ${open?'open':''}" onclick="onCardClick(event,'${m.id}')">
    <div class="meta">
      <span>${m.pinned ? '<span class="pin-flag">📌 置顶</span> · ' : ''}<span class="who">👤 ${String(m.author||'管理员').replace(/</g,'&lt;')}</span> · ${fmt(m.createdTs)}</span>
      ${starboxHtml(m)}
    </div>
    <div class="title">${esc(titleTxt)}</div>
    ${tagChipsHtml(m)}
    ${parts.body ? `<div class="content">${esc(parts.body)}</div>` : ''}
    <div class="actions">
      <span class="expand-hint" onclick="toggleOpen('${m.id}', event)">${open ? '收起 ▴' : '展开 ▾'}</span>
      <span onclick="togglePin('${m.id}')">${m.pinned ? '取消置顶' : '置顶'}</span>
      <span onclick="startEdit('${m.id}')">编辑</span>
      <span onclick="del('${m.id}')">删除</span>
    </div>
  </div>`;
}

// TODO 卡片（TODO 视图）
function todoCardHtml(m) {
  if (m.id === editingId) return editCardHtml(m);
  const st = ST[m.status] ? m.status : 'new';
  const open = openIds.has(m.id);
  const parts = splitMemo(m.content);
  const titleTxt = plainTitle(parts.title) || parts.title || '（无标题）';
  const opts = Object.keys(ST).map(k =>
    `<option value="${k}" ${k === st ? 'selected' : ''}>${ST[k]}</option>`).join('');
  return `<div class="memo st-${st} ${open?'open':''}" onclick="onCardClick(event,'${m.id}')">
    <div class="meta">
      <span><span class="stchip st-${st}">${ST[st]}</span> · <span class="who">👤 ${String(m.author||'管理员').replace(/</g,'&lt;')}</span> · ${fmt(m.createdTs)}</span>
      ${starboxHtml(m)}
    </div>
    <div class="title">${esc(titleTxt)}</div>
    ${tagChipsHtml(m)}
    ${parts.body ? `<div class="content">${esc(parts.body)}</div>` : ''}
    <div class="actions">
      <span class="expand-hint" onclick="toggleOpen('${m.id}', event)">${open ? '收起 ▴' : '展开 ▾'}</span>
      <select title="修改状态" onclick="event.stopPropagation()" onchange="setTodoStatus('${m.id}', this.value)">${opts}</select>
      <span onclick="startEdit('${m.id}')">编辑</span>
      <span onclick="del('${m.id}')">删除</span>
    </div>
  </div>`;
}

// 消息卡片（消息视图）：发送者 → 收件人 + 时间 + 正文
function msgCardHtml(m) {
  const open = openIds.has(m.id);
  const to = m.recipient || 'all';
  const toHtml = to === 'all'
    ? '<span class="tochip all">📢 all</span>'
    : `<span class="tochip">${esc0(to)}</span>`;
  return `<div class="memo msgcard ${open?'open':''}" onclick="onCardClick(event,'${m.id}')">
    <div class="meta">
      <span><span class="who">👤 ${esc0(m.sender)}</span><span class="who-arrow"> → </span>${toHtml} · ${fmt(m.createdTs)}</span>
    </div>
    <div class="content">${esc(m.content)}</div>
    <div class="actions">
      <span class="expand-hint" onclick="toggleOpen('${m.id}', event)">${open ? '收起 ▴' : '展开 ▾'}</span>
      <span onclick="event.stopPropagation();copyMsg('${m.id}')">复制内容</span>
      <span onclick="event.stopPropagation();del('${m.id}')">删除</span>
    </div>
  </div>`;
}

async function copyMsg(id) {
  const m = msgs.find(x => x.id === id);
  if (!m) return;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(m.content);
    } else {
      const t = document.createElement('textarea');
      t.value = m.content;
      document.body.appendChild(t);
      t.select();
      document.execCommand('copy');
      t.remove();
    }
    updateFresh('已复制消息内容 ✓');
  } catch (e) {
    updateFresh('复制失败，请手动选中');
  }
}

// 编辑中的卡片（Feed / TODO 共用）
function editCardHtml(m) {
  return `<div class="memo open" onclick="event.stopPropagation()"><textarea class="editbox">${m.content.replace(/</g,'&lt;')}</textarea>
    <div class="actions"><span onclick="saveEdit('${m.id}')">💾 保存</span><span onclick="editingId=null;render()">取消</span></div></div>`;
}

// ---- 折叠 / 展开 ----
function isFav(m) { return (m.tags || []).indexOf(FAV_TAG) >= 0; }

// 首行当标题，其余当正文
function splitMemo(content) {
  const raw = String(content || '').replace(/\r\n?/g, '\n').trim();
  const i = raw.indexOf('\n');
  if (i < 0) return { title: raw, body: '' };
  return { title: raw.slice(0, i).trim(), body: raw.slice(i + 1).trim() };
}

// 标题只留纯文本：去掉 ** ` #标签
function plainTitle(s) {
  return String(s)
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/(^|\s)#[^\s#<>"'`]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function onCardClick(ev, id) {
  if (ev.target.closest('a, .tag, .tchip, .actions, .star, textarea, button, select')) return;
  const card = ev.currentTarget;
  const hint = card.querySelector('.expand-hint');
  if (hint && hint.style.display === 'none') return; // 内容本来就没被截断
  toggleOpen(id);
}

function toggleOpen(id, ev) {
  if (ev) ev.stopPropagation();
  if (openIds.has(id)) openIds.delete(id); else openIds.add(id);
  render();
}

// 渲染后判断哪些卡片真的被截断了，没截断的隐藏「展开」
function syncExpandHints() {
  document.querySelectorAll('#list .memo').forEach(card => {
    const hint = card.querySelector('.expand-hint');
    if (!hint) return;
    if (card.classList.contains('open')) { hint.style.display = ''; return; }
    let over = false;
    card.querySelectorAll('.title, .content').forEach(el => {
      if (el.scrollHeight > el.clientHeight + 2) over = true;
    });
    hint.style.display = over ? '' : 'none';
  });
}

// ---- 分页 ----
function renderPager(total, pages) {
  const box = document.getElementById('pager');
  if (pages <= 1) { box.innerHTML = ''; return; }
  const nums = [];
  const win = new Set([1, pages, page, page - 1, page + 1, page - 2, page + 2]);
  [...win].filter(n => n >= 1 && n <= pages).sort((a, b) => a - b).forEach(n => nums.push(n));
  let html = `<button ${page <= 1 ? 'disabled' : ''} onclick="gotoPage(${page - 1})">‹ 上一页</button>`;
  let prev = 0;
  nums.forEach(n => {
    if (prev && n - prev > 1) html += '<span class="pinfo">…</span>';
    html += `<button class="${n === page ? 'cur' : ''}" onclick="gotoPage(${n})">${n}</button>`;
    prev = n;
  });
  html += `<button ${page >= pages ? 'disabled' : ''} onclick="gotoPage(${page + 1})">下一页 ›</button>`;
  box.innerHTML = html;
}

function gotoPage(p) {
  page = p;
  render();
  const pg = document.getElementById('pager');
  if (pg) {
    const top = pg.getBoundingClientRect().top + window.pageYOffset - 60;
    window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  }
}

function onFilterChange() { page = 1; render(); }

function toggleFavFilter() {
  favOnly = !favOnly;
  const b = document.getElementById('favBtn');
  if (b) b.classList.toggle('on', favOnly);
  page = 1;
  render();
}

async function toggleStar(ev, id) {
  if (ev) ev.stopPropagation();
  const arr = items();
  const m = arr.find(x => x.id === id);
  if (!m) return;
  const tags = new Set(m.tags || []);
  if (tags.has(FAV_TAG)) tags.delete(FAV_TAG); else tags.add(FAV_TAG);
  try {
    const d = await api(apiBase() + '/' + id, { method: 'PATCH', body: JSON.stringify({ tags: [...tags] }) });
    const updated = d && (d.memo || d.todo);
    if (updated) {
      const i = arr.findIndex(x => x.id === id);
      if (i >= 0) arr[i] = updated;
    }
  } catch (e) { return; }
  render();
}


// boot：URL 带 ?token= 时免密自动登录；否则尝试已有会话
(async () => {
  const sp = new URLSearchParams(location.search);
  const tk = sp.get('token');
  if (tk && /^[0-9a-fA-F-]{36}$/.test(tk)) {
    const r = await fetch('/api/auth?token=' + encodeURIComponent(tk));
    if (r.ok) {
      // 清掉地址栏里的 token，保留 sharecode（网关需要）
      const keep = sp.get('sharecode') ? '/?sharecode=' + sp.get('sharecode') : '/';
      history.replaceState(null, '', keep);
      await init();
      return;
    }
    document.getElementById('loginErr').textContent = '链接无效或已被移除';
  }
  try { await init(); } catch (e) {}
})();
